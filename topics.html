<title>普氏AI · 内容运营台</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --ink:#1f2430; --sub:#6b7280; --line:#e6e8ef;
    --pri:#4f46e5; --pri2:#6366f1; --red:#dc2626; --green:#16a34a; --amber:#d97706;
    --shadow:0 1px 3px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));}
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 0}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .logo{width:34px;height:34px;flex:0 0 auto}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
  .sub{color:var(--sub);font-size:12px}
  .toolbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:10px;
    min-height:44px;padding:0 14px;background:var(--pri);color:#fff;font-weight:600;
    transition:transform .05s ease,filter .15s ease}
  button:active{transform:scale(.97)}
  button.ghost{background:#fff;color:var(--pri);border:1px solid var(--line)}
  button.danger{background:#fff;color:var(--red);border:1px solid #f3c4c4}
  button.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
  button.tiny{min-height:30px;padding:0 9px;font-size:12px;border-radius:7px}
  .hide{display:none!important}
  /* today */
  .today{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-radius:16px;
    padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .today h2{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;opacity:.95}
  .today .item{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;margin-bottom:7px;
    display:flex;align-items:center;gap:8px;font-size:13px}
  .today .item:last-child{margin-bottom:0}
  .today .tag{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.25);white-space:nowrap}
  .today .tag.over{background:#fde2e2;color:#b91c1c}
  .today .tag.due{background:#fef3c7;color:#92400e}
  .today .item .go{margin-left:auto;background:rgba(255,255,255,.22);color:#fff;min-height:30px;padding:0 10px;font-size:12px}
  .today .empty{font-size:13px;opacity:.85}
  /* tabs */
  .nav{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:6px;margin-bottom:12px;position:sticky;top:6px;z-index:5;box-shadow:var(--shadow)}
  .nav button{flex:1;min-height:44px;background:transparent;color:var(--sub);font-weight:600;border-radius:10px}
  .nav button.active{background:var(--pri);color:#fff}
  .nav svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
  .panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:6px}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:600}
  input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical;line-height:1.55}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}
  .chk input{width:18px;height:18px;flex:0 0 auto}
  .card{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
  .card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
  .pill.t1{background:#eef2ff;color:#4338ca}
  .pill.t2{background:#ecfdf5;color:#047857}
  .pill.t3{background:#fff7ed;color:#c2410c}
  .pill.hot{background:#fef2f2;color:#dc2626}
  .pill.st{background:#f1f5f9;color:#475569}
  .pill.over{background:#fde2e2;color:#b91c1c}
  .pill.done{background:#dcfce7;color:#15803d}
  .card .ttl{font-weight:700;font-size:14px;margin:6px 0 3px}
  .card .meta{font-size:12px;color:var(--sub)}
  .card .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .muted{color:var(--sub);font-size:13px}
  .tip{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--sub);margin-top:10px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:20px;color:var(--pri)}
  .stat span{font-size:11px;color:var(--sub)}
  .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:14px 0}
  @media(max-width:768px){
    .row3{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .nav button span{display:none}
    .nav svg{margin-right:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="#4f46e5"/><path d="M7 15l3-3 2 2 5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.5" cy="7.5" r="1.6" fill="#fff"/></svg>
    <div>
      <h1>普氏AI · 内容运营台</h1>
      <div class="sub">不露脸 · 录屏+画外音 · 2026 合规优先</div>
    </div>
    <div class="toolbar">
      <button class="ghost sm" onclick="exportJSON()">导出备份</button>
      <button class="ghost sm" onclick="document.getElementById('imp').click()">导入恢复</button>
      <button class="ghost sm" onclick="resetPreset()">重置预置</button>
      <button class="danger sm" onclick="clearAll()">清空数据</button>
      <input id="imp" type="file" accept="application/json" class="hide" onchange="importJSON(event)">
    </div>
  </header>

  <!-- 今天要处理 -->
  <section class="today">
    <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v9l6 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2"/></svg>今天要处理</h2>
    <div id="todayList"></div>
  </section>

  <!-- 数据概览 -->
  <div class="stats" id="stats"></div>

  <!-- Tabs -->
  <nav class="nav">
    <button class="active" data-tab="topics" onclick="switchTab('topics',this)"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>选题库</span></button>
    <button data-tab="scripts" onclick="switchTab('scripts',this)"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4h11l3 3v13H5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 13h6M9 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>脚本工坊</span></button>
    <button data-tab="pub" onclick="switchTab('pub',this)"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>发布数据</span></button>
    <button data-tab="safe" onclick="switchTab('safe',this)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>合规清单</span></button>
  </nav>

  <!-- 选题库 -->
  <section class="panel" id="p-topics">
    <h3>选题库</h3>
    <form id="f-topic" onsubmit="return addTopic(event)">
      <label>选题标题</label>
      <input name="title" required placeholder="如：用AI 10分钟做一版周报">
      <div class="row">
        <div><label>所属支柱</label>
          <select name="pillar"><option value="热点干货">时事热点/干货</option><option value="工具实战">AI工具实战</option><option value="搞钱案例">AI搞钱案例</option><option value="政策认知">政策认知/避坑</option></select>
        </div>
        <div><label>状态</label>
          <select name="status"><option value="灵感">灵感</option><option value="脚本中">脚本中</option><option value="待发布">待发布</option><option value="已发布">已发布</option><option value="放弃">放弃</option></select>
        </div>
      </div>
      <div class="row">
        <div><label>计划日期</label><input name="planDate" type="date"></div>
        <div><label>&nbsp;</label>
          <label class="chk" style="margin-top:0"><input type="checkbox" name="celeb"> 用名人观点引子</label>
        </div>
      </div>
      <label>备注</label>
      <input name="note" placeholder="角度/来源/参考链接">
      <div style="margin-top:12px"><button type="submit">添加到选题库</button></div>
    </form>
    <div id="topicList" style="margin-top:14px"></div>
  </section>

  <!-- 脚本工坊 -->
  <section class="panel hide" id="p-scripts">
    <h3>脚本工坊（不露脸 · 录屏+画外音）</h3>
    <form id="f-script" onsubmit="return addScript(event)">
      <label>视频标题</label>
      <input name="title" required placeholder="与选题对应">
      <div class="row">
        <div><label>选用模板</label>
          <select name="tpl" onchange="fillTemplate(this)">
            <option value="A">A 痛点秒解法(工具实战)</option>
            <option value="B">B 搞钱拆解式</option>
            <option value="C">C 认知反转型</option>
            <option value="名">名人观点引子(激活老粉)</option>
            <option value="D">D 热点内容拆解(名人+热点+干货)</option>
          </select>
        </div>
        <div><label>封面钩子</label><input name="hook" placeholder="大字钩子文案"></div>
      </div>
      <label>逐字稿 / 分镜（录屏画面 + 画外音）</label>
      <textarea name="body" placeholder="0-3s 画外音：…&#10;3-15s 录屏：…&#10;15-40s 字幕：…"></textarea>
      <div style="margin-top:12px"><button type="submit">保存脚本</button></div>
    </form>
    <div id="scriptList" style="margin-top:14px"></div>
  </section>

  <!-- 发布数据 -->
  <section class="panel hide" id="p-pub">
    <h3>发布 & 数据复盘</h3>
    <form id="f-pub" onsubmit="return addPub(event)">
      <div class="row">
        <div><label>发布日期</label><input name="date" type="date" required></div>
        <div><label>关联选题</label><select name="topicId"><option value="">（无）</option></select></div>
      </div>
      <div class="row3">
        <div><label>播放量</label><input name="views" type="number" inputmode="numeric" placeholder="0"></div>
        <div><label>完播率%</label><input name="comp" type="number" step="0.1" inputmode="decimal" placeholder="0"></div>
        <div><label>互动率%</label><input name="inte" type="number" step="0.1" inputmode="decimal" placeholder="0"></div>
      </div>
      <div class="row3">
        <div><label>涨粉数</label><input name="fans" type="number" inputmode="numeric" placeholder="0"></div>
        <div><label>收藏率%</label><input name="save" type="number" step="0.1" inputmode="decimal" placeholder="0"></div>
        <div><label>状态</label><select name="status"><option value="已发布">已发布</option><option value="待发布">待发布</option></select></div>
      </div>
      <div style="margin-top:12px"><button type="submit">记录发布</button></div>
    </form>
    <div id="pubChart" style="margin-top:16px"></div>
    <div id="pubList" style="margin-top:8px"></div>
  </section>

  <!-- 合规清单 -->
  <section class="panel hide" id="p-safe">
    <h3>AI 发布合规核对清单</h3>
    <div class="tip">每次发布前逐项核对，勾选后「记录本次核对」即留痕。红线：<b>不虚构名言、不 AI 仿声/换脸名人、不整段搬运演讲</b>。</div>
    <label class="chk"><input type="checkbox" class="ck"> 含 AI 生成素材？是 → 发布页勾选「AI 生成内容」标识</label>
    <label class="chk"><input type="checkbox" class="ck"> 不是「纯 AI 无真人观点」模板内容（有录屏实拍/本人观点）</label>
    <label class="chk"><input type="checkbox" class="ck"> 案例/数据真实可验证</label>
    <label class="chk"><input type="checkbox" class="ck"> 未夸大收益 / 虚构功效</label>
    <label class="chk"><input type="checkbox" class="ck"> 若用数字人：已完成主体实名备案</label>
    <label class="chk"><input type="checkbox" class="ck"> 若引名人观点：准确引用、不虚构、不 AI 仿声换脸</label>
    <div style="margin-top:12px"><button type="button" onclick="logCompliance()">记录本次核对</button></div>
    <div id="safeLog" style="margin-top:14px"></div>
  </section>

  <footer>本地存储 · 数据只在你浏览器 · 建议定期「导出备份」</footer>
</div>

async function loadPreset(){
  try{
    const r=await fetch(DATA_URL+'?_='+Date.now());
    if(r.ok){
      const d=await r.json();
      if(d&&Array.isArray(d.topics)&&d.topics.length){ return d; }
    }
  }catch(e){ console.warn('远端选题数据加载失败，已回退到内嵌快照',e); }
  return EMBEDDED_PRESET;
}
function boot(){
  if(topics===null){ seedPreset(); }
  renderAll();
}
function seedPreset(){
  topics=PRESET.topics.map(t=>({id:uid(),seed:true,...t}));
  scripts=PRESET.scripts.map(s=>({id:uid(),seed:true,createdAt:Date.now(),...s}));
  publishes=PRESET.publishes.map(p=>({id:uid(),...p}));
  save('topics',topics);save('scripts',scripts);save('publishes',publishes);save('presetVer',PRESET_VER);
}


/* ---------- 今天要处理 ---------- */
function renderToday(){
  const t=todayStr();
  const box=$('#todayList'); const arr=[];
  topics.forEach(x=>{
    if(['灵感','脚本中','待发布'].includes(x.status)&&x.planDate){
      if(x.planDate<t) arr.push({type:'逾期选题',tag:'over',label:x.title,go:()=>switchTab('topics')});
      else if(x.planDate===t) arr.push({type:'今日选题',tag:'due',label:x.title,go:()=>switchTab('topics')});
    }
  });
  publishes.forEach(x=>{ if(x.date===t&&x.status!=='已发布') arr.push({type:'今日发布',tag:'due',label:'发布待办',go:()=>switchTab('pub')}); });
  if(!arr.length){box.innerHTML='<div class="empty">✅ 今天没有待处理项，稳！</div>';return;}
  box.innerHTML=arr.map(a=>`<div class="item"><span class="tag ${a.tag}">${a.type}</span><span style="flex:1">${esc(a.label)}</span><button class="go" onclick="(${a.go.toString()})()">去处理</button></div>`).join('');
}

function renderStats(){
  const total=topics.length, done=topics.filter(t=>t.status==='已发布').length;
  const pub=publishes.length, fans=publishes.reduce((s,p)=>s+(+p.fans||0),0);
  $('#stats').innerHTML=`
    <div class="stat"><b>${total}</b><span>选题总数</span></div>
    <div class="stat"><b>${done}</b><span>已发布</span></div>
    <div class="stat"><b>${pub}</b><span>发布次数</span></div>
    <div class="stat"><b>${fans}</b><span>累计涨粉</span></div>`;
}

function renderTopics(){
  const box=$('#topicList');
  const order={逾期:0,待发布:1,脚本中:2,灵感:3,已发布:4,放弃:5};
  const list=[...topics].sort((a,b)=>((order[a.status]??9)-(order[b.status]??9))|| (a.planDate||'').localeCompare(b.planDate||''));
  if(!list.length){box.innerHTML='<div class="muted">还没有选题，先在上面添加一条。</div>';return;}
  box.innerHTML=list.map(x=>{
    const ov=x.planDate&&x.planDate<todayStr()&&['灵感','脚本中','待发布'].includes(x.status);
    const pc={热点干货:'hot',工具实战:'t1',搞钱案例:'t2',政策认知:'t3'}[x.pillar]||'st';
    return `<div class="card">
      <div class="top"><span class="pill ${pc}">${x.pillar}</span>
        <span class="pill st">${x.status}</span>
        ${x.celeb?'<span class="pill t3">名人引子</span>':''}
        ${ov?'<span class="pill over">逾期 '+x.planDate+'</span>':(x.planDate?'<span class="muted">'+x.planDate+'</span>':'')}</div>
      <div class="ttl">${esc(x.title)}</div>
      ${x.note?'<div class="meta">'+esc(x.note)+'</div>':''}
      <div class="acts">
        <button class="ghost tiny" onclick="setStatus('${x.id}')">改状态</button>
        <button class="ghost tiny" onclick="del('topics','${x.id}')">删除</button>
      </div></div>`;
  }).join('');
}
function addTopic(e){
  e.preventDefault();const f=e.target;
  topics.unshift({id:uid(),title:f.title.value.trim(),pillar:f.pillar.value,status:f.status.value,
    planDate:f.planDate.value||'',celeb:f.celeb.checked,note:f.note.value.trim()});
  save('topics',topics);f.reset();renderAll();maybeWarn();
}
function setStatus(id){
  const x=topics.find(t=>t.id===id);if(!x)return;
  const ns=prompt('改为状态（灵感/脚本中/待发布/已发布/放弃）：',x.status);
  if(ns&&['灵感','脚本中','待发布','已发布','放弃'].includes(ns)){x.status=ns;save('topics',topics);renderAll();}
}

}
function renderScripts(){
  const box=$('#scriptList');
  if(!scripts.length){box.innerHTML='<div class="muted">还没有脚本，先用模板写一条。</div>';return;}
  box.innerHTML=scripts.map(x=>{
    const tn={A:'模板A',B:'模板B',C:'模板C','名':'名人引子',D:'热点拆解'}[x.tpl]||x.tpl;
    return `<div class="card"><div class="top"><span class="pill st">${tn}</span>${x.hook?'<span class="muted">钩子：'+esc(x.hook)+'</span>':''}</div>
      <div class="ttl">${esc(x.title)}</div>
      <div class="meta" style="white-space:pre-wrap;margin-top:4px">${esc(x.body)}</div>
      <div class="acts"><button class="ghost tiny" onclick="del('scripts','${x.id}')">删除</button></div></div>`;
  }).join('');
}

/* ---------- 发布数据 ---------- */
function fillTopicSelect(){
  const sel=$('#f-pub').topicId; const cur=sel.value;
  sel.innerHTML='<option value="">（无）</option>'+topics.map(t=>`<option value="${t.id}">${esc(t.title.slice(0,18))}</option>`).join('');
  sel.value=cur;
}
function addPub(e){
  e.preventDefault();const f=e.target;
  publishes.unshift({id:uid(),topicId:f.topicId.value,date:f.date.value||todayStr(),
    views:+f.views.value||0,comp:+f.comp.value||0,inte:+f.inte.value||0,
    fans:+f.fans.value||0,save:+f.save.value||0,status:f.status.value});
  save('publishes',publishes);f.reset();fillTopicSelect();renderPub();maybeWarn();
}
function svgBars(rows){
  if(!rows.length) return '<div class="muted">暂无已发布数据，记录后看趋势。</div>';
  const W=560,H=180,pad=28, max=Math.max(...rows.map(r=>r.v),10);
  const bw=Math.min(46,(W-pad*2)/rows.length-10);
  const step=(W-pad*2)/rows.length;
  let bars='';
  rows.forEach((r,i)=>{
    const h=(r.v/max)*(H-pad-14); const x=pad+step*i+(step-bw)/2; const y=H-pad-h;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${r.c}"/>`+
      `<text x="${x+bw/2}" y="${y-5}" font-size="11" fill="#475569" text-anchor="middle">${r.v}</text>`+
      `<text x="${x+bw/2}" y="${H-pad+13}" font-size="10" fill="#94a3b8" text-anchor="middle">${r.l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e6e8ef"/>${bars}</svg>`;
}
function renderPub(){
  const done=publishes.filter(p=>p.status==='已发布');
  $('#pubChart').innerHTML='<div class="muted" style="margin-bottom:6px">完播率趋势（已发布）</div>'+
    svgBars(done.slice(0,8).reverse().map((p,i)=>({l:'#'+(done.length-i),v:p.comp,c:'#4f46e5'})));
  const box=$('#pubList');
  if(!publishes.length){box.innerHTML='<div class="muted">还没有发布记录。</div>';return;}
  box.innerHTML=publishes.map(p=>{
    const t=topics.find(x=>x.id===p.topicId);
    return `<div class="card"><div class="top"><span class="pill st">${p.date}</span>
      <span class="pill ${p.status==='已发布'?'done':'over'}">${p.status}</span>
      ${t?'<span class="muted">'+esc(t.title.slice(0,16))+'</span>':''}</div>
      <div class="meta">播放 ${p.views} · 完播 ${p.comp}% · 互动 ${p.inte}% · 涨粉 ${p.fans} · 收藏 ${p.save}%</div>
      <div class="acts"><button class="ghost tiny" onclick="del('publishes','${p.id}')">删除</button></div></div>`;
  }).join('');
}

/* ---------- 合规清单 ---------- */
function logCompliance(){
  const items=$$('#p-safe .ck'); const passed=items.every(i=>i.checked);
  const fail=items.map((i,idx)=>i.checked?null:idx+1).filter(Boolean);
  safe.unshift({id:uid(),date:todayStr(),passed,fail});
  save('safe',safe);
  items.forEach(i=>i.checked=false);
  renderSafe();
  alert(passed?'✅ 本次核对全部通过，可发布':'⚠️ 第 '+fail.join('、')+' 项未勾选，发布前请处理');
}
function renderSafe(){
  const box=$('#safeLog');
  if(!safe.length){box.innerHTML='<div class="muted">还没有核对记录。</div>';return;}
  box.innerHTML=safe.map(s=>`<div class="card"><div class="top"><span class="pill ${s.passed?'done':'over'}">${s.passed?'通过':'未过'}</span><span class="muted">${s.date}</span></div>
    ${s.passed?'':'<div class="meta" style="margin-top:4px">未通过项：'+s.fail.join('、')+'</div>'}</div>`).join('');
}

/* ---------- 通用 ---------- */
function del(kind,id){
  if(!confirm('确定删除这条？'))return;
  if(kind==='topics')topics=topics.filter(x=>x.id!==id);
  if(kind==='scripts')scripts=scripts.filter(x=>x.id!==id);
  if(kind==='publishes')publishes=publishes.filter(x=>x.id!==id);
  save(kind,kind==='topics'?topics:kind==='scripts'?scripts:publishes);renderAll();
}
function switchTab(name,btn){
  $$('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  ['topics','scripts','pub','safe'].forEach(n=>$('#p-'+n).classList.toggle('hide',n!==name));
}
function exportJSON(){
  const data={topics,scripts,publishes,safe,_v:1,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='普氏AI_内容台备份_'+todayStr()+'.json';a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);
      if(d.topics)topics=d.topics;if(d.scripts)scripts=d.scripts;if(d.publishes)publishes=d.publishes;if(d.safe)safe=d.safe;
      save('topics',topics);save('scripts',scripts);save('publishes',publishes);save('safe',safe);
      fillTopicSelect();renderAll();alert('✅ 导入成功');
    }catch(err){alert('❌ 文件解析失败，请确认是导出的备份');}
  };r.readAsText(f);e.target.value='';
}
function resetPreset(){
  if(!confirm('将用最新示例预置覆盖「示例数据」。\n手动添加的选题会保留；若当前全是旧版预置（无标记），请先点「清空数据」再刷新一次，再点本按钮。确定重置？'))return;
  const tManual=topics.filter(t=>!t.seed);
  const sManual=scripts.filter(s=>!s.seed);
  topics=PRESET.topics.map(t=>({id:uid(),seed:true,...t})).concat(tManual);
  scripts=PRESET.scripts.map(s=>({id:uid(),seed:true,createdAt:Date.now(),...s})).concat(sManual);
  save('topics',topics);save('scripts',scripts);save('presetVer',PRESET_VER);
  renderAll();
  alert('✅ 预置已更新到最新版');
}
function clearAll(){
  if(!confirm('⚠️ 将清空全部选题/脚本/发布/合规数据，且无法撤销！\n建议先点「导出备份」。确定清空？'))return;
  ['topics','scripts','publishes','safe'].forEach(k=>{localStorage.removeItem(PREFIX+k);});
  topics=[];scripts=[];publishes=[];safe=[];fillTopicSelect();renderAll();maybeWarn();
}
function maybeWarn(){
  const n=topics.length+scripts.length+publishes.length;
  if(n>=30&&!localStorage.getItem(PREFIX+'_warned')){
    alert('📌 数据已积累 '+n+' 条，建议点「导出备份」存一份，防止误清空丢失。');
    localStorage.setItem(PREFIX+'_warned','1');
  }
}
function renderAll(){renderToday();renderStats();renderTopics();renderScripts();fillTopicSelect();renderPub();renderSafe();}
loadPreset().then(d=>{ window.PRESET_DATA=d; PRESET=d; PRESET_VER=d.ver||'unknown'; boot(); });
</script>
